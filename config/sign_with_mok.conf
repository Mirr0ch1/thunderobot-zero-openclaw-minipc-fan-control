# /etc/dkms/framework.conf.d/sign_with_mok.conf
#
# Sign every DKMS-built module with the enrolled MOK key so that modules can
# load on Secure Boot systems (kernel lockdown rejects unsigned modules).
#
# The key/cert pair below is the standard location used by Ubuntu's
# shim-signed package.  If you use a different distribution or your own key,
# point these at your own MOK key.  If you don't use Secure Boot, delete this
# file - signing is then unnecessary.
mok_signing_key="/var/lib/shim-signed/mok/MOK.priv"
mok_certificate="/var/lib/shim-signed/mok/MOK.der"
