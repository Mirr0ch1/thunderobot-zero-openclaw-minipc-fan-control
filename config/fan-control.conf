# fan-cap.py configuration - install to /etc/thunderobot-fan-control.conf
# All values are optional; defaults are shown in the comments.

[general]
# seconds between EC updates
interval = 3

[duty]
# hard cap on fan duty in % of maximum fan speed
max = 50
# lowest duty to ever use (keep fans moving; the EC may ignore <~20)
min = 20

[power_mode]
# EC power mode written on start: 0=High (loud/aggressive), 1=Gaming,
# 2=Office (quieter, lower firmware power limits).  -1 = don't touch.
value = 2

[fan_curve]
# temperature curve: list of temp:duty breakpoints, linearly interpolated.
# Below the first point duty = min; above the last point duty = max.
points = 55:20, 70:35, 85:50
