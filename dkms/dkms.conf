# DKMS configuration for the ec_rw module.
# AUTOINSTALL rebuilds this module automatically on every kernel upgrade,
# which is what makes the fan cap survive kernel updates.

PACKAGE_NAME="ec_rw"
PACKAGE_VERSION="1.0"
BUILT_MODULE_NAME[0]="ec_rw"
DEST_MODULE_LOCATION[0]="/extra"
AUTOINSTALL="yes"
MAKE[0]="make KERNELRELEASE=$kernelver"
CLEAN="make clean"
